
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mon album photo</title>

  <link rel="stylesheet"
    href="https://unpkg.com/photoswipe@5.4.4/dist/photoswipe.css">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    header {
      text-align: center;
      padding: 42px 16px 30px;
    }

    h1 {
      font-size: clamp(26px, 5vw, 42px);
      margin: 0 0 10px;
    }

    header p { color: #bbb; }

    .album {
      columns: 3 240px;
      column-gap: 12px;
      padding: 12px;
      max-width: 1500px;
      margin: auto;
    }

    .album a {
      display: block;
      break-inside: avoid;
      margin-bottom: 12px;
      overflow: hidden;
      border-radius: 5px;
    }

    .album img {
      display: block;
      width: 100%;
      height: auto;
      transition: transform .3s ease;
    }

    .album a:hover img {
      transform: scale(1.035);
    }

    footer {
      text-align: center;
      color: #999;
      padding: 30px 12px;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <header>
    <h1>Mes albums photos</h1>
    <p>Quelques instants à partager</p>
  </header>

  <main>
    <div class="album" id="gallery">

      <a href="https://picsum.photos/id/1015/1200/800"
         data-pswp-width="1200" data-pswp-height="800"
         target="_blank">
        <img src="https://picsum.photos/id/1015/600/400"
             alt="Paysage de montagne" loading="lazy">
      </a>

      <a href="https://picsum.photos/id/1016/900/1200"
         data-pswp-width="900" data-pswp-height="1200"
         target="_blank">
        <img src="https://picsum.photos/id/1016/450/600"
             alt="Paysage vertical" loading="lazy">
      </a>

      <a href="https://picsum.photos/id/1018/1200/800"
         data-pswp-width="1200" data-pswp-height="800"
         target="_blank">
        <img src="https://picsum.photos/id/1018/600/400"
             alt="Nature" loading="lazy">
      </a>

      <a href="https://picsum.photos/id/1019/900/1200"
         data-pswp-width="900" data-pswp-height="1200"
         target="_blank">
        <img src="https://picsum.photos/id/1019/450/600"
             alt="Paysage vertical" loading="lazy">
      </a>

      <a href="https://picsum.photos/id/1020/1200/800"
         data-pswp-width="1200" data-pswp-height="800"
         target="_blank">
        <img src="https://picsum.photos/id/1020/600/400"
             alt="Paysage naturel" loading="lazy">
      </a>

      <a href="https://picsum.photos/id/1039/1200/800"
         data-pswp-width="1200" data-pswp-height="800"
         target="_blank">
        <img src="https://picsum.photos/id/1039/600/400"
             alt="Montagnes" loading="lazy">
      </a>

    </div>
  </main>

  <footer>
    © Mon album photo
  </footer>

  <script type="module">
    import PhotoSwipeLightbox from
      'https://unpkg.com/photoswipe@5.4.4/dist/photoswipe-lightbox.esm.js';

    const lightbox = new PhotoSwipeLightbox({
      gallery: '#gallery',
      children: 'a',
      pswpModule: () =>
        import('https://unpkg.com/photoswipe@5.4.4/dist/photoswipe.esm.js')
    });

    lightbox.init();
  </script>
</body>
</html>
